# =============================================================================
# Strix Web 控制台 —— nginx（唯一发布端口的服务，只做 TLS 终止 + 反代）
#
# 这份配置**整体替换**镜像自带的 /etc/nginx/nginx.conf。刻意**不** include
# /etc/nginx/conf.d/*.conf —— 官方镜像的 default.conf 里有一个 `listen 80;` 的
# server，include 进来就等于开了 80 端口，直接违反"不监听 80"。
#
# PLAN.md §Compose 设计要点 列了四条**必须显式写对**的指令（Caddy 是默认行为，
# nginx 不是；漏任何一条都会**静默**破坏实时流）。它们在本文件里各带一个
# 「必须 #n」标记，改动前请先读那张表：
#   #1 map $http_upgrade + proxy_set_header Upgrade/Connection  → 漏了 WebSocket 全灭
#   #2 proxy_buffering off                                      → 漏了 SSE 兜底通道卡死
#   #3 proxy_read_timeout 3600s                                 → 漏了扫描安静 60s 被掐断
#   #4 client_max_body_size 16m                                 → 漏了截图/报告被 413 拒
# =============================================================================

user  nginx;
worker_processes  auto;

# 容器 read_only: true，/var/run 是 tmpfs（见 docker-compose.yml）。
pid /var/run/nginx.pid;

# 直接写容器 stderr，不落盘：日志是密钥泄漏面（验收 #11 会 grep
# `docker compose logs nginx`），能不落盘就不落盘。
#
# ⚠️ 已实测：error log **会**打完整的 `$request` 和上游 URL（含 query string），
# 而 nginx 的 error log 格式**不可配置**，级别也只能整体调。实测输出：
#   [error] connect() failed ... request: "GET /api/health?token=XXX HTTP/2.0",
#           upstream: "http://172.20.0.2:8000/api/health?token=XXX"
# 也就是说下面 access_log 用 $uri 只保证了**访问日志**不含 query，不构成"query
# 绝不出现在日志里"的结构性保证。把级别提到 crit 能压住它，但那会连 502/504 的
# 归因信息一起丢掉 —— 对一个本机自建工具是坏交易。
# 结论：**"敏感值绝不进 URL" 是后端必须自己守的约束**（密钥只经 JSON POST body），
# nginx 这层守不住它。这条要写进 docs/SECURITY-zh.md。
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志刻意**不用** `$request`（它含 query string）；`$uri` 是规范化后的路径。
    # 这只收窄了正常请求的日志面 —— 出错时 error log 仍会打全 URL，见文件顶部那条
    # 实测记录。别把这一行当成"query 不会进日志"的保证。
    log_format  console  '$remote_addr $request_method $uri $status '
                         '$body_bytes_sent ${request_time}s';
    access_log  /dev/stdout console;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;          # 不对外报版本号

    # 必须 #4：默认 1 MB。截图 POST / OpenAPI spec 上传会被 413 静默拒掉。
    client_max_body_size 16m;

    # 必须 #1（上半）：WebSocket 握手要求 Connection: upgrade 原样透传。
    # 非 upgrade 请求必须给 close，否则 keepalive 语义会被破坏。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker 内嵌 DNS。配它 + 下面用变量形式的 proxy_pass，是为了让上游名字在
    # **请求时**解析而不是**启动时**解析：
    #   · `proxy_pass http://web:3000` 这种字面写法会在 nginx 启动时解析 web，
    #     T5 之前 web 服务还不存在 → nginx 直接起不来（host not found in upstream）；
    #   · 容器重建后 IP 会变，字面写法会一直打到旧 IP。
    # 代价：变量形式的 proxy_pass 必须自己拼 URI（`$request_uri`），见下。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        # 只监听 443，且**没有**任何 listen 80 —— 也不做 80→443 跳转，
        # 那等于开了个 80 端口。对外暴露面由 compose 收窄到 127.0.0.1。
        listen 443 ssl;
        http2  on;
        # nginx ≥1.25.1 起 `listen 443 ssl http2` 已弃用，必须拆成 http2 指令。
        #
        # 关于 HTTP/2 与 WebSocket：nginx 不实现 RFC 8441 的 Extended CONNECT，
        # 也不发 SETTINGS_ENABLE_CONNECT_PROTOCOL，因此浏览器会为 WebSocket
        # 自动回落到 HTTP/1.1 升级握手 —— 这正是下面 #1 生效的路径。

        server_name localhost;

        # 由 setup.sh 用 openssl 签发（SAN + EKU=serverAuth，10 年，私钥 0600）。
        # 宿主目录 ${STRIX_HOST_DATA_DIR}/tls 以 :ro 挂进来。
        # 私钥由 master 进程（root）在加载配置时读取，worker（nginx 用户）不需要
        # 读它 —— 所以 0600 + 属主非 nginx 也能正常工作。
        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:2m;
        ssl_session_timeout       1h;
        # 刻意不设 HSTS：证书是手动导入信任的自签证书，给 localhost 打 HSTS 只会在
        # 证书出问题时把浏览器锁死在一条走不通的路上，换不到任何安全收益。

        # ---- 反代公共设置（server 级，所有 location 继承）--------------------
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 必须 #1（下半）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 必须 #2：刻意设在 server 级而不是只设在 /ws 与 SSE 那两个 location 上。
        # 理由：漏设的后果是"静默卡死"，而收益（给 Next.js 的静态响应做缓冲）对一个
        # 本机单用户工具等于零。少一个"新增流式路由时忘了加"的坑，比省那点缓冲值钱。
        proxy_buffering off;

        # 必须 #3：默认 60s。拉沙箱镜像阶段几分钟不出一个字节是常态，
        # 60s 会把 WS/SSE 连接掐断，前端表现为"扫描刚开始就断线"。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 变量形式的 proxy_pass 强制 nginx 在请求时解析上游名（见上面 resolver）。
        set $api_upstream http://api:8000;
        set $web_upstream http://web:3000;

        # REST + SSE 兜底（/api/scans/{id}/stream）。FastAPI 自己就挂在 /api 下，
        # 不需要剥前缀，所以直接拼 `$request_uri`。
        location /api/ {
            proxy_pass $api_upstream$request_uri;
        }

        # WebSocket：/ws/scans/{id} 与 /ws/system。
        location /ws/ {
            proxy_pass $api_upstream$request_uri;
        }

        # 其余全部给 Next.js（含 /_next/*）。**Key 不经过它**：
        # 前端是纯浏览器侧渲染那部分在发 POST /api/keys，反代直连 api。
        location / {
            proxy_pass $web_upstream$request_uri;
        }
    }
}
