# =============================================================================
# Strix Web 控制台 —— api + web + nginx
#
# 刻意不写顶层 `version:` —— Compose v2+ 视其为 obsolete 并打警告，而 T0 的验收
# 项之一就是 `docker compose config` 零警告。
# =============================================================================
name: strix-console

x-console-env: &console-env
  # ---- 同路径挂载：容器内外必须是同一个绝对路径字符串 ----------------------
  # 这不是洁癖。Strix 把"容器内看到的路径"原样交给宿主 docker daemon 去
  # containers.create(mounts=...)（build_bind_mounts / _metadata_mounts /
  # stage_api_specs / build_extra_file_bind_mounts）。两侧路径不一致 = 静默的
  # 路径别名 bug。
  # 四处 STRIX_HOST_DATA_DIR 插值（这里两条 + api 的卷 + nginx 的 tls 卷）都带
  # :? 守卫 —— 否则未设时会先各刷一条 "defaulting to a blank string" 警告，
  # 把真正的错误埋在噪音里。
  CONSOLE_DATA_DIR: "${STRIX_HOST_DATA_DIR:?未设置 STRIX_HOST_DATA_DIR，请先运行 ./setup.sh}"

  # 每任务临时 HOME 与预置 --config 的根（tmpfs，见下方 tmpfs:）
  CONSOLE_EPHEMERAL_HOME_ROOT: "/run/strix"

  # 容器级 TMPDIR 兜底。PLAN.md:124 要求"TMPDIR 也指到该卷下"。ScanLauncher（T9）
  # 会按任务覆盖成 $DATA/scans/<id>/tmp；这里的容器级默认值是防御第二层：任何忘了
  # 设 TMPDIR 的代码路径（含 $TMPDIR/strix_repos、$TMPDIR/strix_api_specs）落到的
  # 仍是一个同路径合法的目录，而不是容器可写层里的 /tmp。
  TMPDIR: "${STRIX_HOST_DATA_DIR:?未设置 STRIX_HOST_DATA_DIR，请先运行 ./setup.sh}/tmp"

  # ---- DooD 关键变量（未文档化、全仓仅一处引用，M0 断言 4 专门验它）--------
  # 设了它：create_kwargs["network"]=<name> 且 pop("ports")，并且
  # _resolve_exposed_port 返回沙箱容器在该网络上的 IP。
  # 不设它：ports 发布到 Docker 宿主 loopback，SDK 解析回 127.0.0.1 —— 在 api
  # 容器里 127.0.0.1 指向它自己，bootstrap_caido 打到死端口，抓包代理静默降级。
  STRIX_DOCKER_SANDBOX_NETWORK: "strix_sandbox"

  STRIX_IMAGE: "ghcr.io/usestrix/strix-sandbox:1.3.0"

  # ---- 外联静默 -----------------------------------------------------------
  # 全部用引号：不加引号 YAML 会把 false 解析成布尔、1 解析成整数。
  STRIX_TELEMETRY: "false"        # PostHog + Scarf
  STRIX_NO_UPDATE_CHECK: "1"      # GitHub / PyPI
  LITELLM_LOG: "ERROR"            # 从不设 set_verbose

  # ---- 孤儿容器回收的抓手 -------------------------------------------------
  # 打成容器 label strix-run-type；STRIX_RUN_ID 由 ScanLauncher 每任务单独设，
  # 刻意不放在这里（放这里所有沙箱会共享同一个 label，Reaper 就没法定位单次扫描）。
  STRIX_RUN_TYPE: "console"

  # ---- 沙箱资源限额（必须参数化：部署机可能是小笔记本也可能是大服务器）------
  # 默认值只对"Docker VM ≥ 8 GB"成立。setup.sh 按宿主实测的 Docker VM 配额算出
  # 建议值写进 .env，并在超过 VM 内存 60% 时阻断 —— 否则沙箱在小机器上会被 OOM
  # kill，而 Strix 的报错会指向"agent 崩了"而不是"内存不够"，极难归因。
  # 这里的 :- 默认值是给"手工 docker compose up 而没跑 setup.sh"的人兜底。
  STRIX_SANDBOX_MEM_LIMIT: "${STRIX_SANDBOX_MEM_LIMIT:-4g}"
  STRIX_SANDBOX_CPUS: "${STRIX_SANDBOX_CPUS:-2}"
  STRIX_SANDBOX_SHM_SIZE: "${STRIX_SANDBOX_SHM_SIZE:-1g}"
  STRIX_SANDBOX_PIDS_LIMIT: "${STRIX_SANDBOX_PIDS_LIMIT:-2048}"

  # ---- 并发扫描槽位（T12c）------------------------------------------------
  # 默认 1，理由是"一进程一次扫描"之外还有一条：每个沙箱都吃上面那份限额，两次并发
  # 扫描在本开发机（Docker VM 7.75 GB）就会互相 OOM。**参数化而不是写死**，因为
  # 部署机规格可变；改它同时要重算上面四个限额。setup.sh 会把这个值写进 .env。
  CONSOLE_MAX_CONCURRENT_SCANS: "${CONSOLE_MAX_CONCURRENT_SCANS:-1}"

  # ---- N2：企业 CA bundle（PLAN.md §N2，2026-09-08 拍板）------------------
  # 默认关闭。启用方式**只有一条**：操作者在 .env 里填 STRIX_EXTRA_CA_FILE=<宿主
  # PEM 绝对路径>，然后**重跑 ./setup.sh**（由它校验 PEM 并派生 CONSOLE_CA_BUNDLE）。
  # 构建期把任何 CA 烧进镜像**永久禁止**（pitfalls 条 15 的裁定不变）——
  # backend/Dockerfile 里没有、也不许有任何 CA 相关的行。
  #
  # 为什么需要 CONSOLE_CA_BUNDLE 这个**派生**变量，而不是一条
  #   SSL_CERT_FILE: "${STRIX_EXTRA_CA_FILE:+/etc/strix/extra-ca.pem}"
  # 就完事：已实测，Compose 对 `:+` 求值出的空串**仍然会把变量设进容器**
  # （`SSL_CERT_FILE=`），而空 SSL_CERT_FILE 会让 OpenSSL 加载 0 张根证书且
  # **不报错** —— 容器内所有 TLS 静默失去信任链。实测：
  #   docker run --rm -e SSL_CERT_FILE= <api镜像> python -c "import ssl; \
  #     print(len(ssl.create_default_context().get_ca_certs()))"  → 0（不设时是 150）
  # 所以这里必须用 `:-` 给一个**真实存在的**默认 bundle 兜底。
  # setup.sh 会 docker run 一次确认该路径在基础镜像里存在，免得镜像换了以后
  # 这条兜底静默变成"0 张根证书"。
  SSL_CERT_FILE: "${CONSOLE_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"
  REQUESTS_CA_BUNDLE: "${CONSOLE_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}"

  # ---- 故意缺席的变量，改动前先读 PLAN.md 泄漏矩阵 ------------------------
  # STRIX_DEBUG：会把 strix.log 拉到 DEBUG 级别，是密钥泄漏面。永不设置。
  # LLM_API_KEY / STRIX_LLM：密钥与模型只经运行时 HTTP 到达内存，再由
  #   ScanLauncher 注入子进程 env。绝不出现在 compose / .env / 镜像层。

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # **必须显式写 target。** Dockerfile 里 `test` 是最后一个阶段（`FROM runtime
      # AS test`），不写 target 时 BuildKit 构建的就是它 —— pytest / ruff 和 tests/
      # 会静默进入生产镜像。这不是洁癖：多装的每个包都是一份攻击面，而"镜像里没有
      # 测试依赖"是可断言的（`python -c "import pytest"` 必须失败），断言就该有。
      # 跑测试是 `docker build --target test` + `docker run --rm`，不走 compose。
      target: runtime
    # 显式 image 名：让 `docker history` / `docker save` 的凭据审计有稳定 tag 可指。
    image: strix-console/api:0.1.0

    environment:
      <<: *console-env

    volumes:
      # ${X}:${X} 就是全部诀窍。绝不改成 named volume —— named volume 的宿主路径
      # 在 Docker Desktop VM 内部，两侧不一致，会静默重现路径别名 bug。
      # 注意这条禁令的精确边界：它只约束会被交给 daemon 去挂载的路径。
      # 详见 pitfalls/history-pitfalls.md 条 5。
      # :? 让"忘了 .env"变成一条带中文提示的错误，而不是一条 "variable is not
      # set, defaulting to blank" 警告 + 一个诡异的 ":" 挂载。
      - "${STRIX_HOST_DATA_DIR:?未设置 STRIX_HOST_DATA_DIR，请先运行 ./setup.sh}:${STRIX_HOST_DATA_DIR}"
      # DooD：Strix 用 docker-py 直连这个 socket 创建兄弟容器（不是嵌套）。
      # 宿主上它是指向 ~/.docker/run/docker.sock 的符号链接，但挂载由 VM 内的
      # daemon 解析，VM 里 /var/run/docker.sock 就是 daemon 自己的 socket。
      - /var/run/docker.sock:/var/run/docker.sock
      # N2 的可选挂载。`:-/dev/null` 是让"变量为空"不报错的唯一干净写法 —— 已实测
      # `- "${VAR:+${VAR}:/etc/strix/extra-ca.pem:ro}"` 在变量为空时让 Compose v5.4.0
      # 直接报 `invalid empty volume spec`，"整条挂载可选"在 compose 里表达不出来。
      # 挂上 /dev/null 是无害的 —— 没有任何变量指向这个路径（见上方 CONSOLE_CA_BUNDLE）。
      - "${STRIX_EXTRA_CA_FILE:-/dev/null}:/etc/strix/extra-ca.pem:ro"

    tmpfs:
      # 每任务临时 HOME + 预置 --config 落在这里（泄漏矩阵 #2）。
      # noexec/nosuid/nodev：这里只该放 JSON 配置和 instruction 文本，不该有可执行物。
      # size=16m：够放 cli-config.json / viewer-auth.json / instruction 文件，小到
      #   即使写满也不会挤爆内存。
      # mode=0700 + user 0:0 → 只有容器内 root 可读。
      # ⚠️ 若 Compose 要求改成长式语法，长式不支持 noexec/nosuid/nodev，那是一次
      #   真实的安全能力回退 —— 停下上报，不许自行接受。见 pitfalls 条 9。
      - "/run/strix:rw,noexec,nosuid,nodev,size=16m,mode=0700"

    networks:
      # 两个都要。api 自己必须在 strix_sandbox 上，否则解析出的沙箱 Caido 端点从
      # api 容器不可达（这是 R1 / M0 断言 4 的全部要害）。
      - default
      - strix_sandbox

    # 需要写 docker.sock。Docker Desktop 下该 socket 的属主/属组不可移植，与其猜
    # GID 再 usermod，不如如实承认：本容器等价于宿主 root（PLAN.md R5），并把这句话
    # 写进 docs/SECURITY-zh.md。
    user: "0:0"

    security_opt:
      - "no-new-privileges:true"

    # PID 1 必须收割 strix 子进程与 docker-cli 僵尸。
    init: true

    # > ScanSupervisor 的 30s 优雅窗口，留 15s 给 finally 清 tmpfs + 回收沙箱。
    stop_grace_period: 45s

    # 只 expose、不 publish：将来只经 nginx(T4) 访问。防火墙配错也暴露不出
    # 发起扫描的接口。
    expose:
      - "8000"

    # 刻意不设 restart: 与 logging:
    #   restart 与 R11（api 重启导致 key handle 全失效、扫描变 orphaned_running）
    #     语义相互作用，留给 T2 连同 KeyVault 生命周期一起定。
    #   logging 的 max-size 关系到 R13 的磁盘耗尽和验收 #11 的日志扫描量，同上。
    # 刻意不设 read_only: —— api 的写入面（pip 的 .pyc、strix 未知的写路径）还没有
    #   实测清单，M0 跑通、写入面被观测清楚之后再收紧。
    # 刻意不设 extra_hosts: —— Docker Desktop 下 host.docker.internal 自动可解析，
    #   加了只对 Linux 宿主有意义。

  # ===========================================================================
  # web —— Next.js 15 standalone。只产出 HTML/CSS/JS，**持有零个凭据**。
  #
  # 刻意不给它 x-console-env，而且**整个 environment 段都不写**。它需要知道的东西
  # 是空集：不读数据目录、不碰 docker.sock、不知道模型是哪一家、更不该看到任何与
  # 凭据相关的东西。需要鉴权的数据全部由**浏览器**直接打 /api/*（同源，经 nginx），
  # Next.js 进程从不代取 —— 理由全文见 frontend/src/lib/api/client.ts 顶部第一节，
  # 并由 eslint 的 `no-restricted-imports`（禁 next/headers）机械保证。
  #
  # 因此 PLAN.md 里原先设想的 `CONSOLE_API_ORIGIN=http://api:8000` 这一行在方案 B
  # 下是**无用的**：没有任何服务端代码会去请求 api。留着它比删掉更糟 —— 它在暗示
  # "服务端可以代取"，而那正是这一轮刻意封掉的东西。
  #
  # NODE_ENV / NEXT_TELEMETRY_DISABLED / PORT / HOSTNAME 四个变量都在
  # frontend/Dockerfile 的 runtime 阶段用 ENV 设定，**不在这里重复**（两处写同一个值
  # 迟早漂移）。其中 HOSTNAME 那条最不直观，事实与实测见下：
  #   · Docker 会给每个容器注入 HOSTNAME=<容器 id 前 12 位>
  #     （实测 `docker run --rm node:24-slim node -e 'console.log(process.env.HOSTNAME)'`
  #     → `1e750d714b3f`）；
  #   · standalone 的 server.js 把 process.env.HOSTNAME 当**监听地址**用，于是不覆盖
  #     它就会去 bind 一个不存在的接口名；
  #   · 镜像里的 `ENV HOSTNAME=0.0.0.0` **足以**压掉那次注入（已实测：只在镜像里设，
  #     容器内读到的就是 `0.0.0.0`）。所以这里不需要再写一行。
  # ===========================================================================
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # 与 api 同一条理由：显式写 target。三阶段里 runtime 恰好是最后一个，但
      # `deps` / `build` 阶段带着 node_modules 和全部源码，绝不能因为将来加了一个
      # 阶段就静默变成默认产物。
      target: runtime
    image: strix-console/web:0.1.0

    networks:
      # **只有 default**，刻意不加 strix_sandbox。
      # api 必须在沙箱网络上是因为它要访问沙箱里的 Caido 端点（M0 断言 4）；web 只是
      # 个渲染器，把它接进沙箱网络等于让被测目标的邻居能直接打到控制台前端。
      - default

    read_only: true

    tmpfs:
      # read_only 之下，Next.js standalone 在运行期需要写的路径只有这两处：
      #   /app/.next/cache —— Next 启动时无条件创建它（增量缓存 / fetch 缓存的根）。
      #     本轮全是静态页，写入量接近 0，但缺了它启动就 EROFS。
      #   /tmp —— Node 自己的 os.tmpdir()。我们的代码不写临时文件，但这类写入不由
      #     我们控制（一次就够炸），16m 是"够用且写满也无害"的量。
      # 两处都不带 noexec —— .next/cache 里将来可能落 Next 的 wasm / 编译产物，
      # 而 /tmp 加 noexec 对 Node 没有额外收益（它不从 /tmp 加载代码）。
      - "/app/.next/cache:size=64m"
      - "/tmp:size=16m"

    security_opt:
      - "no-new-privileges:true"

    # 不写 user: —— 镜像里已经 `USER node`，且拷进去的文件是 `--chown=node:node`。
    # 在这里再写一遍 uid 只会在两边不一致时变成一堆 EACCES。

    # PID 1 要收割 Node 可能派生的子进程。
    init: true

    # 只 expose、不 publish。对外唯一入口是 nginx:443。
    # （本机另有一个在用的 compose 项目占着宿主 3000 —— 我们不发布端口，不冲突。）
    expose:
      - "3000"

    # 刻意**不设 healthcheck**。
    # healthcheck 的唯一实际用处是给 `depends_on: condition: service_healthy` 提供
    # 判据，而我们不用那个：nginx.conf 用变量形式的 proxy_pass + resolver，上游没起来
    # 时返回 502 而不是拒绝启动。加一条只会换来每 30s 一次的日志噪音，和一个
    # "看起来在保证就绪、其实什么都没保证"的绿点。真正的就绪判定在 make verify-e2e。

  # ===========================================================================
  # nginx —— **唯一**发布端口的服务。只做 TLS 终止 + 反代，不跑任何业务逻辑。
  #
  # 刻意不给它 x-console-env：它不需要知道数据目录、沙箱限额、更不该看到任何与
  # 凭据相关的东西。它唯一需要的宿主状态就是那对证书文件。
  # ===========================================================================
  nginx:
    # 按 tag pin 而不是 digest：这是个纯配置容器，不参与 --require-hashes 的审计链，
    # 而 1.27-alpine 会随安全更新滚动 —— 对一个只终止 TLS 的进程，这是收益。
    image: nginx:1.27-alpine

    # 绑 loopback。**不写 "443:443"** —— 那会监听所有网卡，把"发起扫描的接口"
    # 暴露到局域网（本工具具有等同宿主 root 的能力，见 docs/SECURITY-zh.md）。
    # 只有一个映射：443。刻意**不映射 80** —— 也不做 80→443 跳转，那等于开了 80。
    ports:
      - "127.0.0.1:${CONSOLE_WEB_PORT:-443}:443"

    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      # 证书由 setup.sh 用 openssl 签发（SAN + EKU=serverAuth，10 年，私钥 0600）。
      # :ro —— nginx 永远不需要写这里。
      - "${STRIX_HOST_DATA_DIR:?未设置 STRIX_HOST_DATA_DIR，请先运行 ./setup.sh}/tls:/etc/nginx/tls:ro"

    read_only: true

    tmpfs:
      # nginx 的 client_body/proxy/fastcgi 临时文件默认落在 /var/cache/nginx 下。
      # 64m 而非 PLAN 里写的 16m：client_max_body_size 就是 16m，而 body 超过
      # client_body_buffer_size（默认 8–16 KB）就会写临时文件 —— tmpfs 和上限一样大时，
      # 一次 16 MB 上传正好把它撑爆，表现为 500 而不是"磁盘满"。tmpfs 按实际占用
      # 吃内存，64m 只是上限，不预留。
      - "/var/cache/nginx:size=64m"
      # nginx.pid。1m 够了。
      - "/var/run:size=1m"

    security_opt:
      - "no-new-privileges:true"

    # 只是启动顺序，不是就绪判定 —— 两个上游都没有 HEALTHCHECK。
    # nginx.conf 里用变量形式的 proxy_pass + resolver，上游没起来时返回 502 而不是
    # 拒绝启动，所以顺序其实也不关键。
    depends_on:
      - api
      - web

    networks:
      - default

networks:
  strix_sandbox:
    # 固定名，不能带 strix-console_ 项目名前缀 —— Strix 拿
    # STRIX_DOCKER_SANDBOX_NETWORK 的字面串直接传给 containers.create(network=...)，
    # 名字对不上就创建失败。
    name: strix_sandbox
